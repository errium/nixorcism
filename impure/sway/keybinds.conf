# ╻┏ ┏━╸╻ ╻┏┓ ╻┏┓╻╺┳┓┏━┓
# ┣┻┓┣╸ ┗┳┛┣┻┓┃┃┗┫ ┃┃┗━┓
# ╹ ╹┗━╸ ╹ ┗━┛╹╹ ╹╺┻┛┗━┛
# Variables
set $mod Mod4

set $left Left
set $down Down
set $up Up
set $right Right

set $fm nautilus
set $menu rofi -show drun -show-icons
set $term footclient


# Essentials
bindsym $mod+q kill

bindsym $mod+e exec $fm
bindsym $mod+space exec $menu
bindsym $mod+t exec $term

bindsym $mod+Shift+c exec sh -c "swaymsg reload && dms kill && dms run"
bindsym $mod+Shift+l exec dms ipc lock lock
bindsym $mod+Shift+m exec swaynag -t warning -m 'Exit sway?' -B 'Yes' 'swaymsg exit'

bindsym Print exec dms screenshot -q 100 -d ~/Pictures/Screenshots
bindsym Ctrl+Print exec dms screenshot full -q 100 -d ~/Pictures/Screenshots
bindsym Mod1+Print exec dms screenshot window -q 100 -d ~/Pictures/Screenshots


# Navigation
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right


# Move windows
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right


# Workspace navigation
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10


# Move containers across workspaces
bindsym $mod+Shift+1 move container to workspace number 1; workspace 1
bindsym $mod+Shift+2 move container to workspace number 2; workspace 2
bindsym $mod+Shift+3 move container to workspace number 3; workspace 3
bindsym $mod+Shift+4 move container to workspace number 4; workspace 4
bindsym $mod+Shift+5 move container to workspace number 5; workspace 5
bindsym $mod+Shift+6 move container to workspace number 6; workspace 6
bindsym $mod+Shift+7 move container to workspace number 7; workspace 7
bindsym $mod+Shift+8 move container to workspace number 8; workspace 8
bindsym $mod+Shift+9 move container to workspace number 9; workspace 9
bindsym $mod+Shift+0 move container to workspace number 10; workspace 10


# Layouts
bindsym $mod+a focus parent
bindsym $mod+f fullscreen
bindsym $mod+v floating toggle
bindsym $mod+z layout toggle split
bindsym $mod+Shift+v focus mode_toggle

bindsym $mod+Page_Down splitv
bindsym $mod+Page_Up splith

bindsym $mod+Shift+Tab layout stacking
bindsym $mod+Tab layout tabbed


# Scratchpad
bindsym $mod+s scratchpad show
bindsym $mod+Shift+s move scratchpad


# System
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+

bindsym XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindsym XF86MonBrightnessDown exec brightnessctl set 5%-
bindsym XF86MonBrightnessUp exec brightnessctl set +5%

bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioPrev exec playerctl previous
bindsym XF86AudioStop exec playerctl stop


# Resize mode
bindsym $mod+Shift+r mode "resize"
mode "resize" {
    bindsym $left resize shrink width 10px
    bindsym $down resize grow height 10px
    bindsym $up resize shrink height 10px
    bindsym $right resize grow width 10px
    bindsym Escape mode default
    bindsym Return mode default
}


# Misc
floating_modifier $mod normal
