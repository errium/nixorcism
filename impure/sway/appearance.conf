# appearance
gaps inner 8
gaps outer 8
default_border pixel 3
default_floating_border pixel 3

# [swayfx] corners
corner_radius 3

# [swayfx] blur
blur enable
blur_xray disable
blur_passes 3
blur_radius 5
# blur_noise 0.02
# blur_brightness 0.9
# blur_contrast 0.9
# blur_saturation 1.1

# [swayfx] shadows
shadows disable
shadows_on_csd disable
shadow_blur_radius 20
shadow_offset 0 4
shadow_color #0000007F
shadow_inactive_color #00000050

# [swayfx] dim unfocused windows
default_dim_inactive 0.1
dim_inactive_colors.unfocused #000000FF
dim_inactive_colors.urgent #900000FF

# [swayfx] misc
scratchpad_minimize disable
titlebar_separator disable

# [swayfx] per-layer effects (bar/launcher/notifications from your shell)
# namespace = layer-shell namespace of the surface, подставь свой
# layer_effects "<namespace>" blur enable; blur_ignore_transparent enable; shadows enable; corner_radius 12

# [swayfx] per-window overrides
# for_window [app_id="foot"] blur enable, corner_radius 8
# for_window [app_id="rofi"] shadows enable, blur enable
# for_window [class=".*"] blur_ignore_transparent enable
