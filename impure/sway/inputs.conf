input type:keyboard {
    repeat_delay 300
    repeat_rate 35
    xkb_layout us,ru
    xkb_options grp:alt_shift_toggle
}


input type:touchpad {
    tap enabled
    drag enabled
    drag_lock enabled
    natural_scroll enabled
}


input type:pointer {
    accel_profile flat
    pointer_accel 0.2
}


focus_follows_mouse yes
